# @package _global_

# train.py arguments
project_name: regress-lm-bbob-EXP0
experiment_name: numberic-${now:%Y-%m-%d_%H-%M-%S}
use_wandb: true
log_dir: logs
seed: 42
batch_size: 128
num_epochs: 200
learning_rate: 1e-4
save_every_n_epochs: 10

# Learning rate scheduler
scheduler:
  type: cosine  # cosine, linear, constant
  warmup_steps: 100
  min_lr_ratio: 0.1  # minimum learning rate as a ratio of initial lr

# Model parameters from train.py
model:
  max_input_len: 256
  max_num_objs: 1
  d_model: 512
  num_encoder_layers: 6
  num_decoder_layers: 6
  nhead: 8
  dim_feedforward: 2048
  dropout: 0.1

# Dataset parameters from dataset.py's FeynmanDataset
dataset:
  name: bbob
  path:
    train: null
    val: null
  params:
    hdf5_file_train_path: data/bbob_data.h5
    hdf5_file_val_path: data/bbob_val_data.h5
    hdf5_file_test_path: data/bbob_test_data.h5
    random_seed: 42

# Other configurations
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

save_dir: outputs/bbob/numberic/EXP0/${now:%Y-%m-%d}/${now:%H-%M-%S}/checkpoints
if_ntl: false